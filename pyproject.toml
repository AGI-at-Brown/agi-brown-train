[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agi-brown-train"
version = "0.1.0"
description = "Collaborative JAX foundation-model research at Brown"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.4.38",
    "flax>=0.10.2",
    "huggingface-hub>=0.16.4",
    "pyarrow>=21",
    "tensorboard>=2.21.0",
    "tokenizers>=0.20",
    "xprof>=2.24.2",
]

[project.optional-dependencies]
arc = ["arc-agi==0.9.9"]
dev = ["pytest>=8", "ruff>=0.9"]
# lm-evaluation-harness for experiments/models_130m/harness.py. 0.4.13 loads every default task
# from data files; older releases need dataset scripts, which current `datasets` refuses to run.
eval = ["lm-eval==0.4.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/clubfm"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments/models_130m"]
pythonpath = ["."]
markers = ["accelerator: requires compatible accelerator hardware"]

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
